[project]
name = "tutorial-z3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "rich>=15.0.0",
    "z3-solver>=5.3.3.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "mypy>=2.4.1",
    "pyright>=1.1.414",
    "ruff>=0.17.5",
]

[tool.pyright]
# sc/ だけ strict にし、z3 の部分スタブ (sc/typings) を優先して読む。
# ルートの他のファイル (ノートブックなど) には影響させない。
strict = ["sc"]
reportMissingModuleSource = "none"
executionEnvironments = [
  { root = "sc", extraPaths = ["sc/typings", "."] },
]
